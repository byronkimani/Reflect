name: Firebase App Distribution

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Prepare Testing Environment
        run: |
          chmod +x tool/prepare_env.sh
          ./tool/prepare_env.sh testing

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Linter
        run: make lint

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Filter Coverage
        run: |
          lcov --remove coverage/lcov.info '*.g.dart' '*.freezed.dart' '*firebase_options.dart' '*/l10n/*' '*/tables/*' '*/main.dart' -o coverage/lcov.info --ignore-errors unused

      - name: Generate Coverage HTML
        run: genhtml coverage/lcov.info -o coverage/html

      # 99% gate on filtered in-scope lib/ lines (see docs/testing.md exclusions)
      - name: Check Coverage Threshold
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 99

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage/html/

  deploy:
    name: Build & Distribute APK
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Decode Environment Variables
        run: |
          echo "${{ secrets.ENV_PRODUCTION_BASE64 }}" | base64 --decode > .env.production
          chmod +x tool/prepare_env.sh
          ./tool/prepare_env.sh production

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Decode Firebase Credentials
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}" | base64 --decode > firebase-credentials.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=ENV=production \
            --build-number=${{ github.run_number }}

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-info/

      - name: Upload to Firebase App Distribution
        uses: nickwph/firebase-app-distribution-action@v1
        with:
          app: ${{ secrets.FIREBASE_APP_ID }}
          credentials-file: firebase-credentials.json
          groups: qa-team
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f .env.production env/active.env android/app/upload-keystore.jks firebase-credentials.json
